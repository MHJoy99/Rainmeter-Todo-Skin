  <rect x="722" y="318" width="356" height="56" rx="15" fill="#eaf8f0" stroke="#bfe3cf"/>
  <circle cx="752" cy="346" r="11" fill="#1c9152"/><path d="M746 346l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
