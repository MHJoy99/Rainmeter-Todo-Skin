  <text x="72" y="262" font-size="86" font-weight="800" fill="#fff" letter-spacing="-2">Rainmeter</text>
  <text x="72" y="352" font-size="86" font-weight="800" fill="#fff" letter-spacing="-2">Todo Skin</text>
  <text x="72" y="428" font-size="38" font-weight="700" fill="url(#g)">with Google Tasks sync</text>
  <text x="72" y="486" font-size="26" fill="#a9c4e6">Local-first desktop todo board for Windows.</text>
  <text x="72" y="522" font-size="26" fill="#a9c4e6">Click a todo, get a real Google Task. OAuth 2.0.</text>
